<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Bazar - ফ্যাশন বাজার</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-pink-600">Fashion Bazar</h1>
            <div class="flex items-center space-x-3">
                <a href="https://m.me/fashionbazar11" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded-full text-sm font-medium">মেসেঞ্জার</a>
                <div class="relative cursor-pointer">
                    <span class="text-xl">🛒</span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full px-1.5 py-0.2">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <section class="bg-gradient-to-r from-pink-500 to-purple-600 text-white text-center py-10 px-4">
        <h2 class="text-2xl font-bold mb-2">স্টাইলিশ ও আধুনিক পোশাকের সমাহার</h2>
        <p class="text-sm opacity-90">ঘরে বসেই অর্ডার করুন আপনার পছন্দের ফ্যাশন আইটেম!</p>
    </section>

    <!-- Products Section -->
    <main class="container mx-auto px-4 py-6">
        <h3 class="text-lg font-bold text-gray-800 mb-4">জনপ্রিয় পণ্যসমূহ</h3>
        <div id="product-list" class="grid grid-cols-2 gap-4">
            <!-- Sample Product Card -->
            <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="bg-gray-200 h-40 rounded-md mb-2 flex items-center justify-center text-gray-400 text-sm">পণ্যের ছবি</div>
                    <h4 class="text-sm font-semibold text-gray-800 line-clamp-1">এক্সক্লুসিভ প্রিমিয়াম থ্রি-পিস</h4>
                    <p class="text-pink-600 font-bold text-sm mt-1">৳ ১,৪৫০</p>
                </div>
                <button onclick="addToCart('প্রিমিয়াম থ্রি-পিস', 1450)" class="mt-3 w-full bg-pink-600 text-white py-1.5 rounded text-xs font-medium">কার্ডে যোগ করুন</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 text-xs mt-10">
        <p>© ২০২৬ Fashion Bazar | সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

    <script>
        let cartCount = 0;
        function addToCart(name, price) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert(name + ' কার্টে যোগ করা হয়েছে!');
        }
    </script>
</body>
  </html>
