<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Bazar - ফ্যাশন বাজার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-pink-600">✨ Fashion Bazar</h1>
            <div class="flex items-center space-x-3">
                <a href="https://m.me/fashionbazar11" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-full text-xs font-semibold shadow">💬 মেসেঞ্জার</a>
                <div class="relative cursor-pointer bg-pink-50 p-2 rounded-full" onclick="openCart()">
                    <span class="text-xl">🛒</span>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <section class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 text-white text-center py-8 px-4 shadow-md">
        <h2 class="text-2xl font-bold mb-1">স্টাইলিশ ও প্রিমিয়াম পোশাক</h2>
        <p class="text-xs opacity-90">আপনার পছন্দের সেরা থ্রি-পিস ও ফ্যাশন কালেকশন এখন ঘরে বসেই!</p>
    </section>

    <!-- Products Section -->
    <main class="max-w-md mx-auto px-4 py-5">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-bold text-gray-800 border-l-4 border-pink-600 pl-2">জনপ্রিয় কালেকশন</h3>
            <span class="text-xs text-gray-500">সব দেখুন (২)</span>
        </div>
        
        <div class="grid grid-cols-2 gap-3" id="product-grid">
            <!-- Product 1 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between border border-gray-100">
                <div>
                    <div class="relative h-44 bg-gray-200 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400&auto=format&fit=crop&q=60" alt="Product" class="w-full h-full object-cover">
                        <span class="absolute top-2 left-2 bg-pink-600 text-white text-[10px] px-2 py-0.5 rounded-full font-semibold">নতুন</span>
                    </div>
                    <div class="p-3">
                        <h4 class="font-bold text-gray-800 text-xs line-clamp-1">এক্সক্লুসিভ প্রিমিয়াম থ্রি-পিস</h4>
                        <p class="text-pink-600 font-bold text-sm mt-1">৳ ১,৪৫০</p>
                    </div>
                </div>
                <div class="p-3 pt-0">
                    <button onclick="addToCart('এক্সক্লুসিভ প্রিমিয়াম থ্রি-পিস', 1450)" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white text-xs font-semibold py-2 rounded-lg shadow transition">কার্ডে যোগ করুন</button>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between border border-gray-100">
                <div>
                    <div class="relative h-44 bg-gray-200 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=400&auto=format&fit=crop&q=60" alt="Product" class="w-full h-full object-cover">
                        <span class="absolute top-2 left-2 bg-purple-600 text-white text-[10px] px-2 py-0.5 rounded-full font-semibold">হট ডিল</span>
                    </div>
                    <div class="p-3">
                        <h4 class="font-bold text-gray-800 text-xs line-clamp-1">ডিজাইনার লন থ্রি-পিস</h4>
                        <p class="text-pink-600 font-bold text-sm mt-1">৳ ১,২০০</p>
                    </div>
                </div>
                <div class="p-3 pt-0">
                    <button onclick="addToCart('ডিজাইনার লন থ্রি-পিস', 1200)" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white text-xs font-semibold py-2 rounded-lg shadow transition">কার্ডে যোগ করুন</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t text-gray-500 text-center py-4 text-xs mt-10">
        <p>&copy; ২০২৬ Fashion Bazar | সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

    <script>
        let cartCount = 0;
        function addToCart(name, price) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert(name + ' কার্টে যোগ করা হয়েছে!');
        }
        function openCart() {
            alert('আপনার কার্টে ' + cartCount + ' টি পণ্য রয়েছে।');
        }
    </script>
</body>
</html>
