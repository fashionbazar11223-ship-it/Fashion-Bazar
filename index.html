<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Bazar - ফ্যাশন বাজার</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-pink-600">Fashion Bazar</h1>
            <div class="flex items-center space-x-3">
                <a href="https://m.me/fashionbazar11" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded-full text-sm font-medium">মেসেঞ্জার</a>
                <div class="relative cursor-pointer" onclick="openCart()">
                    <span class="text-2xl">🛒</span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full px-1.5 py-0.2">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <section class="bg-gradient-to-r from-purple-600 to-pink-500 text-white text-center py-10 px-4">
        <h2 class="text-2xl md:text-3xl font-bold mb-2">স্টাইলিশ ও আধুনিক পোশাকের সমাহার</h2>
        <p class="text-sm md:text-base opacity-90">ঘরে বসে অর্ডার করুন আপনার পছন্দের ফ্যাশন আইটেম!</p>
    </section>

    <!-- Products Section -->
    <main class="container mx-auto px-4 py-6">
        <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">জনপ্রিয় পণ্যসমূহ</h3>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="product-grid">
            <!-- Product 1 -->
            <div class="bg-white rounded-lg shadow p-3 flex flex-col justify-between">
                <div>
                    <div class="bg-gray-200 h-40 rounded-md flex items-center justify-center text-gray-500 text-sm mb-2">পণ্যের ছবি</div>
                    <h4 class="font-semibold text-gray-800 text-sm md:text-base">এক্সক্লুসিভ প্রিমিয়াম থ্রি-পিস</h4>
                    <p class="text-pink-600 font-bold mt-1">৳ ১,৪৫০</p>
                </div>
                <button onclick="addToCart('এক্সক্লুসিভ প্রিমিয়াম থ্রি-পিস', 1450)" class="mt-3 w-full bg-pink-600 hover:bg-pink-700 text-white text-sm py-2 rounded transition">কার্ডে যোগ করুন</button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white rounded-lg shadow p-3 flex flex-col justify-between">
                <div>
                    <div class="bg-gray-200 h-40 rounded-md flex items-center justify-center text-gray-500 text-sm mb-2">পণ্যের ছবি</div>
                    <h4 class="font-semibold text-gray-800 text-sm md:text-base">ডিজাইনার লন থ্রি-পিস</h4>
                    <p class="text-pink-600 font-bold mt-1">৳ ১,২০০</p>
                </div>
                <button onclick="addToCart('ডিজাইনার লন থ্রি-পিস', 1200)" class="mt-3 w-full bg-pink-600 hover:bg-pink-700 text-white text-sm py-2 rounded transition">কার্ডে যোগ করুন</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 text-xs mt-10">
        <p>&copy; ২০২৬ Fashion Bazar | সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

    <script>
        let cartCount = 0;
        function addToCart(name, price) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert(name + ' কার্টে যোগ করা হয়েছে!');
        }
        function openCart() {
            alert('আপনার কার্টে ' + cartCount + ' টি পণ্য রয়েছে।');
        }
    </script>
</body>
</html>
